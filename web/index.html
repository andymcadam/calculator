<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Calculator</h1>
      <form id="calc-form">
        <label for="expression">Expression</label>
        <input id="expression" name="expression" placeholder="(2+3)*4" required />

        <label for="user-id">User ID</label>
        <input id="user-id" name="userId" value="demo-user" required />

        <label for="session-id">Session ID</label>
        <input id="session-id" name="sessionId" value="demo-session" required />

        <button type="submit">Calculate</button>
      </form>

      <section>
        <h2>Result</h2>
        <pre id="result">No calculation yet.</pre>
      </section>

      <section>
        <div class="history-header">
          <h2>History</h2>
          <button id="refresh-history" type="button">Refresh</button>
        </div>
        <ul id="history"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
