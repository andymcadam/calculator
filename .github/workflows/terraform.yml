name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'backend/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=/home/runner/work/calculator/calculator/terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=/home/runner/work/calculator/calculator/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=/home/runner/work/calculator/calculator/terraform validate
