name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /home/runner/work/calculator/calculator/backend/requirements.txt

      - name: Run unit tests
        run: |
          cd /home/runner/work/calculator/calculator/backend
          python -m unittest discover -s tests -p 'test_*.py'
